[package]
name = "nortex-marketplace"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Self-hostable NORTEX extension marketplace backend"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
ed25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
