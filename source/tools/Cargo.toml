[package]
name = "nortex-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "nortex"
path = "cli/main.rs"

[[bin]]
name = "nortex-fmt"
path = "formatter/main.rs"

[[bin]]
name = "nortex-language-server"
path = "language-server/main.rs"

[[bin]]
name = "nortex-pkg"
path = "package-manager/main.rs"

[[bin]]
name = "nortex-doc"
path = "documentation-generator/main.rs"

[dependencies]
nortex-compiler = { path = "../compiler" }
