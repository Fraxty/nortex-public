[workspace]
resolver = "3"
members = [
    "compiler",
    "runtime",
    "ide",
    "graphics",
    "tools",
    "marketplace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["NORTEX Contributors"]

[workspace.dependencies]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
