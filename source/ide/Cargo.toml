[package]
name = "nortex-ide"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nortex-code"
path = "src/main.rs"

[dependencies]
nortex-compiler = { path = "../compiler" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
epaint_default_fonts = "0.31.1"
flate2 = "1"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_IO"] }

[target."cfg(windows)".build-dependencies]
winres = "0.1.12"
